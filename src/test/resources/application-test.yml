spring:
  datasource:
    url: jdbc:h2:mem:taskflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  storage:
    upload-dir: ./target/test-uploads
    max-file-size-bytes: 10485760
  seed:
    enabled: false

security:
  jwt:
    secret: test-only-secret-long-enough-for-hs256-signing
    issuer: taskflow
    access-token-ttl: 15m
    refresh-token-ttl: 7d

logging:
  level:
    root: WARN
    com.taskflow: WARN
    org.springframework: WARN
